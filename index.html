<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banda Bassotti - Sito Ufficiale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .jersey-container { position: relative; display: inline-block; }
        .jersey-container img { width: 100%; height: auto; display: block; }
        
        /* Maglia GRANDE (Rosa) */
        .jersey-container-lg { width: 80px; }
        .jersey-container-lg .jersey-name { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); color: #ffffff; font-family: sans-serif; font-weight: 900; text-transform: uppercase; font-size: 8px; letter-spacing: 0.5px; white-space: nowrap; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .jersey-container-lg .jersey-number { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); color: #facc15; font-family: sans-serif; font-weight: 900; font-size: 24px; line-height: 1; text-shadow: 2px 2px 3px rgba(0,0,0,0.9); }

        /* Maglia PICCOLA (Statistiche) */
        .jersey-container-sm { width: 45px; }
        .jersey-container-sm .jersey-name { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); color: #ffffff; font-family: sans-serif; font-weight: 900; text-transform: uppercase; font-size: 4px; letter-spacing: 0.3px; white-space: nowrap; text-shadow: 1px 1px 1px rgba(0,0,0,0.8); }
        .jersey-container-sm .jersey-number { position: absolute; top: 40%; left: 50%; transform: translateX(-50%); color: #facc15; font-family: sans-serif; font-weight: 900; font-size: 14px; line-height: 1; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); }
    </style>
</head>
<body class="bg-white text-black font-sans antialiased">

    <nav class="bg-white border-b-4 border-red-600 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <div class="flex items-center space-x-3">
                <span class="font-black text-xl tracking-wider text-black">BANDA BASSOTTI</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-10 space-y-10">
        
        <div class="border border-slate-200 rounded-2xl p-6 bg-white shadow-sm border-l-8 border-blue-600">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-black text-black tracking-tight uppercase">Stagione 1</h2>
                <button onclick="togglePannelloStats()" class="bg-black text-white px-4 py-2 rounded-lg font-bold text-sm shadow-md hover:bg-red-600 transition">
                    Visualizza Dati <i id="freccia-stats" class="fas fa-chevron-down ml-2"></i>
                </button>
            </div>
            
            <div id="pannello-stats" class="hidden space-y-8">
                <div>
                    <h3 class="font-black text-blue-600 mb-4 text-lg border-b pb-2">Risultati Partite</h3>
                    <div id="tabella-partite-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
                </div>
                <div>
                    <h3 class="font-black text-red-600 mb-4 text-lg border-b pb-2">Statistiche Giocatori</h3>
                    <div id="tabella-stats-container" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>

        <div class="border border-slate-200 rounded-2xl p-6 bg-white shadow-sm border-l-8 border-pink-500">
            <h2 class="text-2xl font-black text-black tracking-tight uppercase mb-6">La Rosa</h2>
            <div id="container-rosa" class="space-y-3"></div>
        </div>

    </main>

    <script>
        // Funzione Decoder per accenti italiani
        function estraiTestoCSV(buffer) {
            const decoder = new TextDecoder('windows-1252');
            return decoder.decode(buffer);
        }

        // 1. CARICAMENTO ROSA
        function caricaTesserati() {
            fetch('Elenco_Tesserati.csv?t=' + Date.now())
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const data = estraiTestoCSV(buffer);
                    const righe = data.split(/\r?\n/);
                    const container = document.getElementById('container-rosa');
                    container.innerHTML = '';
                    
                    for (let i = 1; i < righe.length; i++) {
                        const col = righe[i].split(';');
                        if (col.length < 8) continue;
                        const [cognome, nome, qual, tel, dataN, mail, num, nick] = col;
                        
                        const row = document.createElement('div');
                        row.className = "p-4 bg-slate-50 rounded-xl border flex items-center gap-6";
                        row.innerHTML = `
                            <div class="jersey-container jersey-container-lg">
                                <img src="RetroMaglia.png" alt="Maglia">
                                <span class="jersey-name">${nick ? nick.toUpperCase() : nome.toUpperCase()}</span>
                                <span class="jersey-number">${num || '--'}</span>
                            </div>
                            <div class="font-black uppercase">${cognome} ${nome}</div>
                        `;
                        container.appendChild(row);
                    }
                });
        }

        // 2. CARICAMENTO STATISTICHE
        function generaStatistiche() {
            fetch('Statistiche1.csv?t=' + Date.now())
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const data = estraiTestoCSV(buffer);
                    const righe = data.split(/\r?\n/);
                    let html = `<table class="w-full text-left text-xs border-collapse">
                        <thead><tr class="bg-slate-900 text-white"><th class="p-2">Giocatore</th><th class="p-2">Pres</th><th class="p-2">Gol</th></tr></thead>
                        <tbody>`;
                    
                    for(let i = 1; i < righe.length; i++) {
                        const col = righe[i].split(';');
                        if(col.length < 9) continue;
                        // Indici: 0:Cognome, 1:Nome, 2:N°Maglia, 3:NomeMaglia, 7:Presenze, 8:Goals
                        const [cog, nom, num, nick, , , , pres, gol] = col;
                        html += `<tr>
                            <td class="p-2 border flex items-center gap-2">
                                <div class="jersey-container jersey-container-sm">
                                    <img src="RetroMaglia.png">
                                    <span class="jersey-name">${nick || nom}</span>
                                    <span class="jersey-number">${num}</span>
                                </div>
                                ${nom} ${cog}
                            </td>
                            <td class="p-2 border">${pres}</td>
                            <td class="p-2 border text-red-600 font-bold">${gol}</td>
                        </tr>`;
                    }
                    document.getElementById('tabella-stats-container').innerHTML = html + '</tbody></table>';
                });
        }

        // 3. CARICAMENTO PARTITE
        function generaPartite() {
            fetch('Stagione1.csv?t=' + Date.now())
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const data = estraiTestoCSV(buffer);
                    const righe = data.split(/\r?\n/);
                    let html = '';
                    for(let i = 1; i < righe.length; i++) {
                        const col = righe[i].split(';');
                        if(col.length < 6) continue;
                        const [giornata, casa, golC, golT, trasf, dataM, campo] = col;
                        const isBB = casa.includes('Banda Bassotti') || trasf.includes('Banda Bassotti');
                        html += `
                            <div class="border p-4 rounded-xl ${isBB ? 'bg-red-50 border-red-200' : 'bg-white'}">
                                <div class="text-[10px] text-slate-400 font-bold">${giornata} • ${dataM}</div>
                                <div class="font-bold text-sm">${casa} vs ${trasf}</div>
                                <div class="text-xl font-black">${golC} - ${golT}</div>
                            </div>
                        `;
                    }
                    document.getElementById('tabella-partite-container').innerHTML = html;
                });
        }

        function togglePannelloStats() {
            const p = document.getElementById('pannello-stats');
            p.classList.toggle('hidden');
            if(!p.classList.contains('hidden') && document.getElementById('tabella-stats-container').innerHTML === '') {
                generaStatistiche();
                generaPartite();
            }
        }

        window.onload = caricaTesserati;
    </script>
</body>
</html>
