<style>
.jersey-container{position:relative;display:inline-block;width:100px;flex-shrink:0}.jersey-container img{width:100%;display:block}.jersey-name{position:absolute;top:25%;left:50%;transform:translateX(-50%);color:#000;font-family:'Arial Black',sans-serif;font-weight:900;text-transform:uppercase;font-size:7px;letter-spacing:.5px;max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jersey-number{position:absolute;top:40%;left:50%;transform:translateX(-50%);color:#000;font-family:'Arial Black',sans-serif;font-weight:900;font-size:24px;line-height:1}.jersey-container-sm{width:80px}.jersey-container-sm .jersey-name{font-size:6px}.jersey-container-sm .jersey-number{font-size:20px}#pannello-stats{transition:all .3s ease}
</style>

<script>
let statsCaricate=false;

function estraiTestoCSV(buffer){
    return new TextDecoder("utf-8").decode(buffer)
}

function escapeHTML(str){
    return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
}

function generaStatistiche(){

    fetch('Statistiche1.csv?t='+Date.now())

    .then(res=>{
        if(!res.ok) throw new Error('Statistiche non trovate');
        return res.arrayBuffer()
    })

    .then(buffer=>{

        const data=estraiTestoCSV(buffer);

        const righe=data
        .split(/\r?\n/)
        .map(r=>r.trim())
        .filter(r=>r.length>0);

        let html=`
        <div class="overflow-hidden rounded-3xl border border-slate-200 shadow-lg">
        <table class="w-full text-left text-sm border-collapse bg-white">

        <thead>
        <tr class="bg-slate-900 text-white">
            <th class="p-4">Giocatore</th>
            <th class="p-4 text-center">Pres</th>
            <th class="p-4 text-center">Gol</th>
            <th class="p-4 text-center">Assist</th>
            <th class="p-4 text-center text-yellow-300">
                <i class="fas fa-square"></i>
            </th>
            <th class="p-4 text-center text-red-500">
                <i class="fas fa-square"></i>
            </th>
        </tr>
        </thead>

        <tbody>
        `;

        for(let i=1;i<righe.length;i++){

            const col=righe[i].split(';');

            if(col.length<12) continue;

            const[
                cog,
                nom,
                num,
                nick,
                ,
                ,
                ,
                pres,
                gol,
                assist,
                gialli,
                rossi
            ]=col;

            html+=`
            <tr class="border-t hover:bg-slate-50 transition">

                <td class="p-4">

                    <div class="flex items-center gap-4">

                        <div class="jersey-container jersey-container-sm">

                            <img src="RetroMaglia.png" alt="Maglia">

                            <span class="jersey-name">
                                ${escapeHTML(nick||nom)}
                            </span>

                            <span class="jersey-number">
                                ${escapeHTML(num)}
                            </span>

                        </div>

                        <span class="font-black text-base">
                            ${escapeHTML(nom)} ${escapeHTML(cog)}
                        </span>

                    </div>

                </td>

                <td class="p-4 text-center font-bold">
                    ${escapeHTML(pres)}
                </td>

                <td class="p-4 text-center font-black text-red-600">
                    ${escapeHTML(gol)}
                </td>

                <td class="p-4 text-center font-black text-blue-600">
                    ${escapeHTML(assist)}
                </td>

                <td class="p-4 text-center font-black text-yellow-500">
                    ${escapeHTML(gialli)}
                </td>

                <td class="p-4 text-center font-black text-red-600">
                    ${escapeHTML(rossi)}
                </td>

            </tr>
            `;
        }

        html+='</tbody></table></div>';

        document.getElementById(
            'tabella-stats-container'
        ).innerHTML=html;

    })

    .catch(err=>{

        console.error(err);

        document.getElementById(
            'tabella-stats-container'
        ).innerHTML=`
        <p class="text-red-500">
            Errore caricamento statistiche.
        </p>
        `;
    })
}

function generaPartite(){

    fetch('Stagione1.csv?t='+Date.now())

    .then(res=>{
        if(!res.ok) throw new Error('Partite non trovate');
        return res.arrayBuffer()
    })

    .then(buffer=>{

        const data=estraiTestoCSV(buffer);

        const righe=data
        .split(/\r?\n/)
        .map(r=>r.trim())
        .filter(r=>r.length>0);

        let html='';

        for(let i=1;i<righe.length;i++){

            const col=righe[i].split(';');

            if(col.length<7) continue;

            const[
                giornata,
                casa,
                golC,
                golT,
                trasf,
                dataM
            ]=col;

            let classe='bg-slate-100 border-slate-200';

            const gc=parseInt(golC)||0;
            const gt=parseInt(golT)||0;

            const bandaCasa=(casa||'')
            .toLowerCase()
            .includes('banda bassotti');

            const bandaTrasf=(trasf||'')
            .toLowerCase()
            .includes('banda bassotti');

            if(gc!==gt){

                let vittoriaBB=false;

                if(bandaCasa && gc>gt) vittoriaBB=true;
                if(bandaTrasf && gt>gc) vittoriaBB=true;

                classe=vittoriaBB
                ?'bg-green-100 border-green-300'
                :'bg-red-100 border-red-300'
            }

            html+=`
            <div class="border p-4 rounded-2xl ${classe} shadow-sm">

                <div class="text-[10px] text-slate-500 font-bold mb-1">
                    ${escapeHTML(giornata)}
                    •
                    ${escapeHTML(dataM)}
                </div>

                <div class="font-black text-sm">
                    ${escapeHTML(casa)}
                </div>

                <div class="text-2xl font-black my-2">
                    ${escapeHTML(golC)}
                    -
                    ${escapeHTML(golT)}
                </div>

                <div class="font-black text-sm">
                    ${escapeHTML(trasf)}
                </div>

            </div>
            `;
        }

        document.getElementById(
            'tabella-partite-container'
        ).innerHTML=html;

    })

    .catch(err=>{

        console.error(err);

        document.getElementById(
            'tabella-partite-container'
        ).innerHTML=`
        <p class="text-red-500">
            Errore caricamento partite.
        </p>
        `;
    })
}
</script>
